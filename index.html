<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Blokwork-Fl/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Blokwork - A privacy-focused, theme-driven note-taking app with markdown support, tagging, and workspace management.">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval';
                 style-src 'self' 'unsafe-inline';
                 font-src 'self';
                 connect-src 'self';
                 img-src 'self' data:;
                 base-uri 'self';
                 form-action 'self';">

  <!-- Additional Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Blokwork">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Blokwork</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading indicator */
    body {
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading Blokwork...</div>

  <script>
    // Disable right-click context menu except for text inputs
    window.addEventListener('contextmenu', function(event) {
      const allowDefault = event.target?.closest('input, textarea, [data-allow-browser-menu="true"]');
      if (!allowDefault) {
        event.preventDefault();
      }
    });

    // Remove loading indicator when app starts
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
